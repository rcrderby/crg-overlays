# Perform linting with GitHub Super Linter
# https://github.com/github/super-linter

---
# Name of the action
name: Lint Code Base

# Events that trigger the action
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on a branch; never cancel main runs so the
# post-merge run always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  run-lint:
    name: Run Lint
    # Same-repo pushes are already covered by the 'push' event, so only
    # run the pull_request event for forks (their branches are not in
    # this repo and so never trigger 'push')
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      # checkout action documentation
      # https://github.com/marketplace/actions/checkout
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      # Super Linter action documentation
      # https://github.com/marketplace/actions/super-linter
      - name: Lint Code Base
        uses: super-linter/super-linter/slim@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_CSS: true
          VALIDATE_CSS_PRETTIER: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITLEAKS: true
          VALIDATE_HADOLINT: true
          VALIDATE_HTML: true
          VALIDATE_JAVASCRIPT_ES: true
          VALIDATE_JAVASCRIPT_PRETTIER: true
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true
          # Language-specific configuration
          YAML_ERROR_ON_WARNING: true
